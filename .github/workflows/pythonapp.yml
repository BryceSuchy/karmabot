name: Python application

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry==2.2.1
        poetry install --no-interaction --no-ansi
    - name: Run tests
      run: poetry run pytest
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        poetry run flake8 karmabot --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. 
        poetry run flake8 karmabot --count --exit-zero --max-complexity=15 --statistics
    - name: Lint with Radon
      run: |
        poetry run radon cc karmabot -a -nc
